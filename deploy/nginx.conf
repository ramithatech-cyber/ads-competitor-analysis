# nginx site: public port 80 -> the portal on 127.0.0.1:8765, behind a password.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/ads-portal
#          sudo ln -s /etc/nginx/sites-available/ads-portal /etc/nginx/sites-enabled/
server {
    listen 80;
    server_name _;                      # replace _ with your domain, e.g. ads.example.com

    client_max_body_size 200M;          # video uploads

    auth_basic "Ads Competitor Analysis";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;        # PDF export can take a while
    }
}
