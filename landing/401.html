<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Spyra</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --clay: #D97757; --clay-deep: #C15F3C; --ink: #141413; --muted: #B9B6AA; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--ink); color: #fff; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; position: relative; overflow: hidden; }
body::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(#ffffff0a 1px, transparent 1px), linear-gradient(90deg, #ffffff0a 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(ellipse at 50% 40%, #000 15%, transparent 70%); }
.glow { position: absolute; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, #D9775744, transparent 65%); top: -160px; left: 50%; transform: translateX(-50%); }
.card { position: relative; width: 100%; max-width: 420px; text-align: center; border: 1px solid #ffffff1f; background: #1E1D1Bcc; backdrop-filter: blur(10px); border-radius: 24px; padding: 40px 28px; }
.lock { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 20px; display: grid; place-items: center; background: #D977571f; border: 1px solid #D9775755; }
h1 { margin: 0 0 10px; font-size: 26px; letter-spacing: -0.02em; }
p { margin: 0 0 26px; color: var(--muted); font-size: 15px; line-height: 1.55; }
.btn { display: block; border-radius: 999px; padding: 13px 20px; font-weight: 700; font-size: 15px; text-decoration: none; transition: background .15s, transform .15s; }
.btn:hover { transform: translateY(-1px); }
.primary { background: var(--clay); color: #fff; box-shadow: 0 10px 30px -10px #D9775799; }
.primary:hover { background: var(--clay-deep); }
.ghost { color: #D9D6CC; margin-top: 10px; border: 1px solid #ffffff26; }
.ghost:hover { background: #ffffff10; }
small { display: block; margin-top: 22px; color: #73726C; font-size: 12px; }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main class="card">
    <div class="lock" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#D97757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.3" fill="#D97757"/></svg>
    </div>
    <h1>Sign in to Spyra</h1>
    <p>The app is private. Enter the username and password you were given to continue.</p>
    <a class="btn primary" href="/" onclick="location.reload(); return false;">Sign in</a>
    <a class="btn ghost" href="https://spyra.si">Back to spyra.si</a>
    <small>Don't have access? Ask your Spyra admin for a login.</small>
  </main>
</body>
</html>
